<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AL BURR FAST FOOD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f3f3;
            min-height: 100vh;
        }

        .app {
            max-width: 500px;
            min-height: 100vh;
            margin: auto;
            background: white;
            padding: 25px 20px;
        }

        .logo {
            text-align: center;
            margin: 10px auto 25px;
        }

        .logo img {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }

        .welcome {
            text-align: center;
            margin-bottom: 25px;
        }

        .welcome h1 {
            color: #d71920;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #555;
            font-size: 15px;
        }

        .form-box {
            margin-top: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        input:focus,
        textarea:focus {
            border-color: #d71920;
        }

        .continue-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #d71920;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="logo">
            <img src="al-burr-logo.png" alt="AL BURR FAST FOOD">
        </div>

        <div class="welcome">
            <h1>AL BURR</h1>
            <p>FAST FOOD & PIZZA</p>
        </div>

        <div class="form-box">

            <label>آپ کا نام</label>
            <input type="text" id="name" placeholder="اپنا نام لکھیں">

            <label>فون نمبر</label>
            <input type="tel" id="phone" placeholder="03XXXXXXXXX">

            <label>ڈیلیوری کا پتہ</label>
            <textarea id="address" placeholder="اپنا مکمل پتہ لکھیں"></textarea>

            <button class="continue-btn" onclick="continueOrder()">
                آرڈر شروع کریں
            </button>

        </div>

    </div>

    <script>
        function continueOrder() {

            let name = document.getElementById("name").value;
            let phone = document.getElementById("phone").value;
            let address = document.getElementById("address").value;

            if (name === "" || phone === "" || address === "") {
                alert("براہ کرم تمام معلومات مکمل کریں۔");
                return;
            }

            alert("خوش آمدید " + name + "!");
        }
    </script>

</body>
</html>
